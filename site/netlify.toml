[build]
  publish = ".output/public"
  command = "cd .. && pnpm install --frozen-lockfile && pnpm --filter ./site run generate && test -s site/.output/public/index.html"

[build.environment]
  NUXT_TELEMETRY_DISABLED = "1"

# See frontend/netlify.toml for the rationale: Netlify auto deploy-previews
# don't get the per-PR env, so they point at production. The repo's real
# per-PR previews are the `pr-N--` aliases from the GitHub Actions workflow.
# Publish an inert static notice (a successful build is required to replace
# the deploy-preview URL's content; a failing build leaves the old one live).
[context.deploy-preview]
  command = "true"
  publish = "deploy-preview-notice"

[dev]
  command = "pnpm run dev"
  port = "${SITE_PORT}"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Custom domain configuration
# Add rsm.studio in Netlify dashboard: Site settings > Domain management
