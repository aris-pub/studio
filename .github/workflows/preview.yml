name: Preview Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  APP_NAME: aris-backend-pr-${{ github.event.pull_request.number }}

permissions:
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        path: studio

    - name: Clone RSM repository
      uses: actions/checkout@v6
      with:
        repository: aris-pub/rsm
        path: rsm

    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Create preview app and database
      env:
        DB_APP: ${{ env.APP_NAME }}-db
      run: |
        if ! flyctl status --app "$APP_NAME" 2>/dev/null; then
          # Create ephemeral Postgres for this PR
          flyctl postgres create \
            --name "$DB_APP" \
            --org personal \
            --region fra \
            --vm-size shared-cpu-1x \
            --vm-memory 1024 \
            --volume-size 1 \
            --initial-cluster-size 1

          # Create the app
          flyctl apps create "$APP_NAME" --org personal

          # Attach database (sets DATABASE_URL)
          flyctl postgres attach "$DB_APP" --app "$APP_NAME"

          # flyctl postgres attach sets DATABASE_URL automatically.
          # Backend config falls back DB_URL_PROD -> DATABASE_URL with scheme conversion.
          flyctl secrets set --app "$APP_NAME" \
            ENV="PREVIEW" \
            JWT_SECRET_KEY="preview-${{ github.event.pull_request.number }}" \
            TEST_USER_EMAIL="preview@aris.pub" \
            TEST_USER_PASSWORD="preview-pass-${{ github.event.pull_request.number }}" \
            RESEND_API_KEY="" \
            FRONTEND_URL="https://pr-${{ github.event.pull_request.number }}--${{ secrets.NETLIFY_FRONTEND_SITE }}.netlify.app"
        fi

    - name: Generate lockfiles for rsm native packages
      run: |
        cd rsm/tree-sitter-rsm && npm install --package-lock-only
        cd ../packages/rsm-lsp && npm install --package-lock-only

    - name: Deploy backend to Fly
      run: |
        flyctl deploy --app "$APP_NAME" \
          --config studio/backend/fly.toml \
          --dockerfile studio/backend/Dockerfile \
          --ha=false \
          --yes \
          --remote-only

    # --- Frontend: build locally, upload to Netlify ---

    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: studio/frontend/pnpm-lock.yaml

    - name: Install frontend dependencies
      working-directory: studio/frontend
      run: pnpm install --frozen-lockfile

    - name: Build frontend with preview env vars
      working-directory: studio/frontend
      env:
        VITE_API_BASE_URL: https://${{ env.APP_NAME }}.fly.dev
        VITE_MULTIPLAYER_URL: wss://${{ env.APP_NAME }}.fly.dev:1234
        VITE_ENV: preview
        VITE_PRESS_URL: https://scroll.press
      run: pnpm run build

    - name: Deploy frontend to Netlify
      working-directory: studio/frontend
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FRONTEND_SITE_ID }}
      run: |
        npx netlify-cli deploy \
          --dir=dist \
          --alias=pr-${{ github.event.pull_request.number }} \
          --message="PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"

    - name: Comment preview URLs
      uses: actions/github-script@v7
      with:
        script: |
          const prNum = context.issue.number;
          const appName = process.env.APP_NAME;
          const netlifySite = '${{ secrets.NETLIFY_FRONTEND_SITE }}';
          const frontendUrl = `https://pr-${prNum}--${netlifySite}.netlify.app`;
          const backendUrl = `https://${appName}.fly.dev`;
          const body = [
            '### Preview Deploy',
            '',
            `**Frontend:** ${frontendUrl}`,
            `**Backend:** ${backendUrl}`,
            `**API docs:** ${backendUrl}/docs`,
            '',
            'This preview will be destroyed when the PR is closed.',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNum,
          });
          const existing = comments.find(c => c.body.includes('### Preview Deploy'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
              body,
            });
          }

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Destroy preview app and database
      run: |
        flyctl apps destroy "$APP_NAME" --yes || true
        flyctl apps destroy "$APP_NAME-db" --yes || true
