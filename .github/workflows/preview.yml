name: Preview Deploy

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/preview.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/preview.yml'

concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  deploy:
    # Skip deploy for dependabot PRs — dependency bumps don't need preview environments
    # and creating fly apps for them generates orphans + cost without value.
    # Let CI run on these PRs; just skip the fly preview.
    if: github.event.action != 'closed' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
    - name: Resolve PR number
      id: pr
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
        else
          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for branch ${{ github.ref_name }}, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Skip if no PR
      if: steps.pr.outputs.skip == 'true'
      run: echo "No PR found, skipping deploy"

    - uses: actions/checkout@v6
      if: steps.pr.outputs.skip != 'true'
      with:
        path: studio
        fetch-depth: 0

    - name: Resolve backend environment
      if: steps.pr.outputs.skip != 'true'
      id: backend
      run: |
        PR_NUM="${{ steps.pr.outputs.number }}"
        echo "test_user=preview-pr-${PR_NUM}@aris.pub" >> "$GITHUB_OUTPUT"
        echo "url=https://aris-backend-pr-${PR_NUM}.fly.dev" >> "$GITHUB_OUTPUT"
        echo "app=aris-backend-pr-${PR_NUM}" >> "$GITHUB_OUTPUT"

    - name: Clone RSM repository
      if: steps.pr.outputs.skip != 'true'
      uses: actions/checkout@v6
      with:
        repository: aris-pub/rsm
        submodules: recursive
        path: rsm

    - name: Setup Fly CLI
      if: steps.pr.outputs.skip != 'true'
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Create preview app and database
      if: steps.pr.outputs.skip != 'true'
      env:
        APP_NAME: aris-backend-pr-${{ steps.pr.outputs.number }}
        DB_APP: aris-backend-pr-${{ steps.pr.outputs.number }}-db
      run: |
        if ! flyctl status --app "$APP_NAME" 2>/dev/null; then
          flyctl postgres create \
            --name "$DB_APP" \
            --org personal \
            --region fra \
            --vm-size shared-cpu-1x \
            --vm-memory 512 \
            --volume-size 1 \
            --initial-cluster-size 1

          flyctl apps create "$APP_NAME" --org personal
          flyctl ips allocate-v6 --app "$APP_NAME"
          flyctl ips allocate-v4 --shared --app "$APP_NAME"
          flyctl postgres attach "$DB_APP" --app "$APP_NAME"

          flyctl secrets set --app "$APP_NAME" \
            ENV="PROD" \
            JWT_SECRET_KEY="preview-${{ steps.pr.outputs.number }}" \
            TEST_USER_EMAIL="${{ steps.backend.outputs.test_user }}" \
            TEST_USER_PASSWORD="${{ secrets.PREVIEW_TEST_PASSWORD }}" \
            RESEND_API_KEY="" \
            FRONTEND_URL="https://pr-${{ steps.pr.outputs.number }}--${{ secrets.NETLIFY_FRONTEND_SITE }}.netlify.app"
        fi

    - name: Deploy backend to Fly
      if: steps.pr.outputs.skip != 'true'
      env:
        APP_NAME: aris-backend-pr-${{ steps.pr.outputs.number }}
      run: |
        sed -i 's/npm ci --ignore-scripts/npm install --ignore-scripts/' studio/backend/Dockerfile
        sed -i 's/npm ci --omit=dev/npm install/' studio/backend/Dockerfile

        flyctl deploy --app "$APP_NAME" \
          --config studio/backend/fly.toml \
          --dockerfile studio/backend/Dockerfile \
          --ha=false \
          --yes \
          --local-only

    - name: Seed test user
      if: steps.pr.outputs.skip != 'true'
      env:
        APP_NAME: ${{ steps.backend.outputs.app }}
        TEST_USER: ${{ steps.backend.outputs.test_user }}
        TEST_PASSWORD: ${{ secrets.PREVIEW_TEST_PASSWORD }}
      run: |
        for i in $(seq 1 30); do
          if curl -sf --max-time 10 "https://$APP_NAME.fly.dev/docs" > /dev/null 2>&1; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend... ($i/30)"
          sleep 10
        done
        # Migrations run via Dockerfile CMD (alembic upgrade head) before uvicorn,
        # so /docs returning 200 is sufficient proof migrations completed.
        # Single retry on transient ssh failures; fail loudly if seed actually broken.
        seed_cmd="cd /app && TEST_USER_EMAIL=$TEST_USER TEST_USER_PASSWORD=$TEST_PASSWORD python scripts/reset_test_user.py"
        if ! flyctl ssh console --app "$APP_NAME" -C "sh -c '$seed_cmd'"; then
          echo "Seed attempt 1 failed; retrying after 10s..."
          sleep 10
          flyctl ssh console --app "$APP_NAME" -C "sh -c '$seed_cmd'"
        fi

    # --- Frontend: build locally, upload to Netlify ---

    - uses: pnpm/action-setup@v5
      if: steps.pr.outputs.skip != 'true'
      with:
        package_json_file: studio/package.json

    - uses: actions/setup-node@v4
      if: steps.pr.outputs.skip != 'true'
      with:
        node-version: 20
        cache: pnpm
        cache-dependency-path: studio/pnpm-lock.yaml

    - name: Install frontend dependencies
      if: steps.pr.outputs.skip != 'true'
      working-directory: studio
      run: pnpm install --frozen-lockfile --filter aris

    - name: Build frontend with preview env vars
      if: steps.pr.outputs.skip != 'true'
      working-directory: studio
      env:
        VITE_API_BASE_URL: ${{ steps.backend.outputs.url }}
        VITE_MULTIPLAYER_URL: wss://${{ steps.backend.outputs.app }}.fly.dev:1234
        VITE_ENV: preview
        VITE_PRESS_URL: https://scroll.press
        BACKEND_PORT: "8000"
        FRONTEND_PORT: "5173"
        SITE_PORT: "3000"
        STORYBOOK_PORT: "6006"
        DB_PORT: "5432"
        DB_NAME: "aris"
        TEST_DB_NAME: "aris_test"
        NUXT_BACKEND_URL: ${{ steps.backend.outputs.url }}
      run: pnpm --filter aris run build

    - name: Deploy frontend to Netlify
      if: steps.pr.outputs.skip != 'true'
      uses: nwtgck/actions-netlify@v3
      with:
        publish-dir: studio/frontend/dist
        production-deploy: false
        alias: pr-${{ steps.pr.outputs.number }}
        deploy-message: "PR #${{ steps.pr.outputs.number }}"
        github-token: ${{ secrets.GITHUB_TOKEN }}
        enable-commit-comment: false
        enable-pull-request-comment: false
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_FRONTEND_SITE_ID }}

    - name: Comment preview URLs
      if: steps.pr.outputs.skip != 'true'
      uses: actions/github-script@v7
      env:
        BACKEND_URL: ${{ steps.backend.outputs.url }}
        NETLIFY_SITE_NAME: ${{ secrets.NETLIFY_FRONTEND_SITE }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        TEST_USER: ${{ steps.backend.outputs.test_user }}
      with:
        script: |
          const prNum = parseInt(process.env.PR_NUMBER);
          const backendUrl = process.env.BACKEND_URL;
          const netlifySite = process.env.NETLIFY_SITE_NAME;
          const frontendUrl = `https://pr-${prNum}--${netlifySite}.netlify.app`;
          const body = [
            '### Preview Deploy',
            '',
            `**Frontend:** ${frontendUrl}`,
            `**Backend:** ${backendUrl}`,
            `**API docs:** ${backendUrl}/docs`,
            '',
            `**Test user:** \`${process.env.TEST_USER}\``,
            '',
            'This preview will be destroyed when the PR is closed.',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNum,
          });
          const existing = comments.find(c => c.body.includes('### Preview Deploy'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
              body,
            });
          }

  destroy:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    # Share the deploy job's concurrency group so a force-close mid-deploy
    # waits for the in-flight deploy to finish before tearing it down.
    # Without this, destroy can race with create and leave orphan resources.
    concurrency:
      group: preview-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false

    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_NAME: aris-backend-pr-${{ github.event.pull_request.number }}

    steps:
    - name: Setup Fly CLI
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Destroy preview app and database
      run: |
        # Treat "app does not exist" as success (not every closed PR had a deploy);
        # any other failure is reported loudly so orphans don't accumulate silently.
        destroy_app() {
          local app="$1"
          if ! flyctl status --app "$app" >/dev/null 2>&1; then
            echo "App $app does not exist; skipping."
            return 0
          fi
          if ! flyctl apps destroy "$app" --yes; then
            echo "::error title=Destroy failed::Failed to destroy fly app $app — investigate manually with 'flyctl apps destroy $app'"
            return 1
          fi
          echo "Destroyed $app."
        }
        rc=0
        destroy_app "$APP_NAME" || rc=1
        destroy_app "$APP_NAME-db" || rc=1
        exit $rc
