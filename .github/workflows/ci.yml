        VITE_MULTIPLAYER_URL=ws://localhost:1234 npm run dev &
        FRONTEND_PID=$!
        echo "Frontend started with PID: $FRONTEND_PID"

        # Wait for frontend
        sleep 15

        # Install just task runner
        echo "Installing just task runner..."
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

        # Run collaboration tests (sequential with --workers=1)
        echo "Running collaboration E2E tests on ${{ matrix.browser }}..."
        cd ../
        just test-collab ${{ matrix.browser }} github
        TEST_EXIT_CODE=$?

        # Cleanup
        echo "Cleaning up processes..."
        kill $FRONTEND_PID 2>/dev/null || true
        kill $BACKEND_PID 2>/dev/null || true
        kill $MULTIPLAYER_PID 2>/dev/null || true
        exit $TEST_EXIT_CODE

