      with:
        submodules: recursive

    - name: Clone RSM repository
      run: |
        cd ..
        git clone --recurse-submodules https://github.com/aris-pub/rsm.git
        echo "Cloned RSM repository to ../rsm"

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install uv
      run: pip install uv

    - name: Setup PostgreSQL
      run: |
        brew install postgresql
        brew services start postgresql
        # Wait for PostgreSQL to be ready
        for i in {1..30}; do
          if pg_isready -q; then
            echo "PostgreSQL is ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "PostgreSQL failed to start"
            exit 1
          fi
          sleep 2
        done
        # Create postgres user with password to match global DB URLs
        createuser -s postgres
        psql -d postgres -c "ALTER USER postgres PASSWORD 'postgres';"
        createdb test_aris

    - name: Create virtual environment and sync dependencies
      working-directory: backend
      run: |
        uv venv
        uv sync --group test --group dev
        # Force reinstall RSM from local clone to override the locked git version
        uv pip install --reinstall --no-deps -e ../../rsm

    - name: Run database migrations and setup test user (with debugging)
      working-directory: backend
      run: |
        echo "🔍 [DEBUG] Starting database setup for test-type: ${{ matrix.test-type }}"
        echo "🔍 [DEBUG] Environment variables:"
        echo "  - TEST_USER_EMAIL: ${TEST_USER_EMAIL:-UNSET}"
        echo "  - TEST_USER_PASSWORD length: ${#TEST_USER_PASSWORD}"
        echo "  - DB_URL_LOCAL: ${DB_URL_LOCAL:-UNSET}"
        echo "  - PostgreSQL connection test:"

        # Test database connectivity
        if pg_isready -q; then
          echo "✅ PostgreSQL connection successful"
        else
          echo "❌ PostgreSQL connection failed"
          exit 1
        fi

        # Run migrations
        echo "🔄 Running database migrations..."
        uv run alembic upgrade head
        MIGRATION_EXIT_CODE=$?
        echo "📊 Migration exit code: $MIGRATION_EXIT_CODE"

        # Setup test user for enabled auth mode
        if [ "${{ matrix.test-type }}" = "auth" ]; then
          echo "🔑 Auth tests - creating test user..."
          echo "📧 Creating test user: ${TEST_USER_EMAIL}"
          uv run python scripts/reset_test_user.py
          RESET_USER_EXIT_CODE=$?
          echo "📊 Reset test user exit code: $RESET_USER_EXIT_CODE"

          if [ $RESET_USER_EXIT_CODE -eq 0 ]; then
            echo "✅ Test user creation/reset completed successfully"
          else
            echo "❌ Test user creation/reset FAILED with exit code: $RESET_USER_EXIT_CODE"
            exit $RESET_USER_EXIT_CODE
          fi
        else
          echo "🔓 Demo tests - skipping test user creation"
        fi

        echo "✅ [DEBUG] Database setup completed for ${{ matrix.test-type }} tests"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install multiplayer server dependencies
      working-directory: multi-player
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-browsers-${{ runner.os }}-mobile-safari

    - name: Install Playwright browsers
      working-directory: frontend
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install webkit

    - name: Platform-specific environment debugging
      run: |
        echo "🔍 [PLATFORM-DEBUG] Platform debugging for macOS:"
        echo "  - Runner OS: $RUNNER_OS"
        echo "  - OS Name: $(uname -s)"
        echo "  - OS Version: $(uname -r)"
        echo "  - Architecture: $(uname -m)"
        echo "  - PostgreSQL version: $(postgres --version 2>/dev/null || echo 'not in PATH')"
        echo "  - Python version: $(python --version 2>/dev/null || echo 'not in PATH')"
        echo "  - Python3 version: $(python3 --version 2>/dev/null || echo 'not in PATH')"
        echo "  - UV version: $(uv --version 2>/dev/null || echo 'not in PATH')"
        echo "  - Brew info: $(brew --version 2>/dev/null || echo 'not in PATH')"
        echo "  - Available environment variables:"
        env | grep -E "(TEST_|DB_|DISABLE_|VITE_)" | sort || echo "No matching env vars"

    - name: Start backend and frontend, run Mobile Safari E2E tests
      run: |
        # Start Y.js multiplayer server
        echo "Starting Y.js multiplayer server..."
        cd multi-player
        MULTIPLAYER_PORT=1234 HOST=0.0.0.0 node server.js &
        MULTIPLAYER_PID=$!
        echo "Multiplayer server started with PID: $MULTIPLAYER_PID"
        sleep 3

        # Start backend
        echo "Starting backend for ${{ matrix.test-type }} Mobile Safari E2E tests..."
        cd ../backend
        uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
        BACKEND_PID=$!
        echo "Backend started with PID: $BACKEND_PID"

        # Wait for backend
        sleep 8
        for i in {1..5}; do
          if curl -f http://localhost:8000/health; then
            echo "Backend ready for E2E tests"
            break
          else
            echo "Waiting for backend... ($i/5)"
            if [ $i -eq 5 ]; then
              echo "Backend failed to start"
              kill $BACKEND_PID 2>/dev/null || true
              kill $MULTIPLAYER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 2
          fi
        done

        # Start frontend
        cd ../frontend
        VITE_MULTIPLAYER_URL=ws://localhost:1234 npm run dev &
        FRONTEND_PID=$!
        echo "Frontend started with PID: $FRONTEND_PID"

        # Wait for frontend
        sleep 15

        # Run mobile Safari tests
        if [ "${{ matrix.test-type }}" = "demo" ]; then
          echo "Running demo Mobile Safari E2E tests: @core|@mobile-only (excluding @desktop-only, @auth, and @site)"
          TEST_USER_EMAIL="${TEST_USER_EMAIL}" TEST_USER_PASSWORD="${TEST_USER_PASSWORD}" CI_TEST_TYPE=demo npx playwright test --grep "^(?!.*@auth).*(@core|@mobile-only)(?!.*@desktop-only)(?!.*@site)" --project="Mobile Safari" --reporter=github
        else
          echo "Running auth Mobile Safari E2E tests: @auth[^-]|@auth-flows (excluding @desktop-only and @site)"
          TEST_USER_EMAIL="${TEST_USER_EMAIL}" TEST_USER_PASSWORD="${TEST_USER_PASSWORD}" CI_TEST_TYPE=auth npx playwright test --grep "(@auth[^-]|@auth-flows)(?!.*@desktop-only)(?!.*@site)" --project="Mobile Safari" --reporter=github
        fi
        TEST_EXIT_CODE=$?

        # Cleanup
        echo "Cleaning up processes..."
        kill $FRONTEND_PID 2>/dev/null || true
        kill $BACKEND_PID 2>/dev/null || true
        kill $MULTIPLAYER_PID 2>/dev/null || true
        exit $TEST_EXIT_CODE


# Trigger CI

  # EXPERIMENTAL: Run collab tests with Docker Compose (test environment hypothesis)
  e2e-collab-docker:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]  # Start with chromium only
    runs-on: ubuntu-latest
    env:
      TEST_USER_EMAIL: testuser@aris.pub
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      VITE_LOG_LEVEL: WARN
      VITE_MULTIPLAYER_URL: ws://localhost:1234
      COPILOT_PROVIDER: mock
      ENV: CI
      BACKEND_PORT: 8000
      FRONTEND_PORT: 5173
      SITE_PORT: 3000
      STORYBOOK_PORT: 6006
      DB_PORT: 5439
      DB_NAME: aris
      TEST_DB_NAME: test_aris

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Clone RSM repository
      run: |
        cd ..
        git clone --recurse-submodules https://github.com/aris-pub/rsm.git
        echo "Cloned RSM repository to ../rsm"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ matrix.browser }}

    - name: Install Playwright browsers
      working-directory: frontend
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install ${{ matrix.browser }} --with-deps

    - name: Create .env file
      run: cp .env.example .env

    - name: Create backend .env file
      run: cp backend/.env.example backend/.env

    - name: Start Docker Compose services
      run: |
        echo "🧹 Cleaning up any previous Docker resources..."
        docker compose -f docker/docker-compose.dev.yml down -v 2>/dev/null || true
        docker system prune -f

        echo "🐳 Starting all services via Docker Compose..."
        docker compose -f docker/docker-compose.dev.yml up -d --force-recreate

        echo "⏳ Waiting for services to be ready (30s)..."
        sleep 30

        echo "📊 Service status:"
        docker compose -f docker/docker-compose.dev.yml ps

        echo "🔍 Checking service health..."
        curl -f http://localhost:8000/health || echo "⚠️  Backend health check failed"
        curl -f http://localhost:5173 || echo "⚠️  Frontend health check failed"

        echo "✅ Docker services ready"

    - name: Run collaboration E2E tests
      working-directory: frontend
      env:
        TEST_USER_EMAIL: ${{ env.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      run: |
        echo "🧪 Running collaboration tests on ${{ matrix.browser }} (Docker environment)..."
        npx playwright test --grep "@collab" --project=${{ matrix.browser }} --reporter=github --workers=1

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-docker-${{ matrix.browser }}
        path: frontend/test-results/
        retention-days: 7

    - name: Show Docker logs on failure
      if: failure()
      run: |
        echo "📋 Backend logs:"
        docker compose -f docker/docker-compose.dev.yml logs backend
        echo "📋 Frontend logs:"
        docker compose -f docker/docker-compose.dev.yml logs frontend
        echo "📋 Multiplayer logs:"
        docker compose -f docker/docker-compose.dev.yml logs collab

    - name: Cleanup Docker services
      if: always()
      run: |
        echo "🧹 Cleaning up Docker services..."
        docker compose -f docker/docker-compose.dev.yml down -v
        echo "✅ Cleanup complete"

