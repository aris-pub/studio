        sleep 3
        echo "Multiplayer server ready"

        # Start backend
        echo "Starting backend for collaboration E2E tests..."
        cd ../backend
        uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
        BACKEND_PID=$!
        echo "Backend started with PID: $BACKEND_PID"

