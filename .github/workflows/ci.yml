name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI identifier (all jobs load .env, but ENV=CI enables CI-specific behavior)
  ENV: CI

jobs:
  # Unit Tests and Linting (Parallel)
  unit-backend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test_secret_key_for_ci_environment_32_chars_minimum

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_aris
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Clone RSM repository
      run: |
        cd ..
        git clone --recurse-submodules https://github.com/aris-pub/rsm.git
        echo "Cloned RSM repository to ../rsm"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install RSM dependencies
      run: |
        cd ../rsm
        uv sync

    - name: Install backend dependencies
      run: |
        cd backend
        uv sync --all-groups

    - name: Create backend .env file
      run: cp backend/.env.example backend/.env

    - name: Debug - Test PostgreSQL connection
      run: |
        echo "Testing PostgreSQL connection..."
        cd backend
        uv run python -c "
        import asyncio
        import asyncpg

        async def test():
            # Test connection to test_aris
            try:
                conn = await asyncpg.connect(
                    host='localhost',
                    port=5432,
                    user='postgres',
                    password='postgres',
                    database='test_aris'
                )
                print('✅ Connection to test_aris successful!')
                version = await conn.fetchval('SELECT version()')
                print(f'PostgreSQL version: {version}')
                await conn.close()
            except Exception as e:
                print(f'❌ Connection to test_aris failed: {e}')
                raise

            # Test connection to postgres admin database
            try:
                conn = await asyncpg.connect(
                    host='localhost',
                    port=5432,
                    user='postgres',
                    password='postgres',
                    database='postgres'
                )
                print('✅ Connection to postgres admin db successful!')
                await conn.close()
            except Exception as e:
                print(f'❌ Connection to postgres admin db failed: {e}')
                raise

        asyncio.run(test())
        "

    - name: Run tests
      run: |
        cd backend
        uv run pytest -n4 --dist=loadscope --tb=short

  unit-frontend:
    runs-on: ubuntu-latest
    env:
      BACKEND_PORT: 8000
      VITE_API_BASE_URL: http://localhost:8000

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run tests
      run: |
        cd frontend
        npm run test:run

  unit-site:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: site

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Clone RSM repository
      run: |
        cd ..
        git clone --recurse-submodules https://github.com/aris-pub/rsm.git
        echo "Cloned RSM repository to ../rsm"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: site/package-lock.json

    - name: Cache node_modules
      uses: actions/cache@v5
      id: cache-node-modules-site
      with:
        path: site/node_modules
        key: node-modules-site-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}

    - name: Install dependencies
      if: steps.cache-node-modules-site.outputs.cache-hit != 'true'
      run: npm ci

    - name: Cache vitest
      uses: actions/cache@v5
      with:
        path: site/node_modules/.vitest
        key: vitest-site-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}

    - name: Check for missing packages
      run: npm ls --depth=0

    - name: Run unit tests
      run: npm run test:run

  # Site E2E Tests (All Browsers)
  e2e-site:
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'push' && fromJSON('["chromium","firefox"]') || fromJSON('["chromium"]') }}
    runs-on: ubuntu-latest
    env:
      ENV: CI
      VITE_LOG_LEVEL: WARN
      COMPOSE_FILE: docker/docker-compose.dev.yml
      COMPOSE_PROJECT_NAME: studio-e2e-site-${{ matrix.browser }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Clone RSM repository
      run: |
        cd ..
        git clone --recurse-submodules https://github.com/aris-pub/rsm.git
        echo "Cloned RSM repository to ../rsm"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: site/package-lock.json

    - name: Cache node_modules
      uses: actions/cache@v5
      id: cache-node-modules
      with:
        path: site/node_modules
        key: node-modules-site-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}

    - name: Install site dependencies
      working-directory: site
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-site-${{ runner.os }}-${{ matrix.browser }}

    - name: Install Playwright browsers
      working-directory: site
      run: npx playwright install ${{ matrix.browser }} --with-deps

    - name: Create .env file
      run: cp .env.example .env

    - name: Create backend .env file
      run: cp backend/.env.example backend/.env

    - name: Build and start Docker Compose services
      run: |
        docker compose --env-file .env build
        docker compose --env-file .env up -d

        echo "⏳ Waiting for services..."
        for i in $(seq 1 180); do
          if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
            echo "✅ Services ready after ${i}s"
            break
          fi
          if [ "$i" = "180" ]; then
            echo "❌ Services failed to start"
            docker compose --env-file .env logs --tail=30
            exit 1
          fi
          sleep 1
        done

    - name: Setup database and test user in Docker
      run: |
        docker compose --env-file .env exec -T backend uv run alembic upgrade head

    - name: Run site E2E tests
      working-directory: site
      run: |
        echo "🧪 Running site E2E tests on ${{ matrix.browser }} (desktop + mobile)..."

        export $(cat ../.env | grep -v '^#' | grep -v '^$' | xargs)

        if [ "${{ matrix.browser }}" = "firefox" ]; then
          npx playwright test --project=firefox --project="Mobile Firefox" --reporter=github
        else
          npx playwright test --project=chromium --project="Mobile Chrome" --reporter=github
        fi

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-site-${{ matrix.browser }}
        path: site/test-results/
        retention-days: 7

    - name: Show Docker logs on failure
      if: failure()
      run: |
        echo "📋 Backend logs:"
        docker compose --env-file .env logs backend
        echo "📋 Frontend logs:"
        docker compose --env-file .env logs frontend
        echo "📋 Site logs:"
        docker compose --env-file .env logs site

    - name: Cleanup Docker services
      if: always()
      run: |
        echo "🧹 Stopping containers for $COMPOSE_PROJECT_NAME..."
        docker compose down --remove-orphans
        echo "✅ Cleanup complete"


  # Frontend E2E Tests (sharded, both browsers share one Docker stack per shard)
  e2e-frontend:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      ENV: CI
      VITE_LOG_LEVEL: WARN
      COMPOSE_FILE: docker/docker-compose.dev.yml
      COMPOSE_PROJECT_NAME: studio-e2e-frontend-${{ matrix.shard }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Clone RSM repository
      run: |
        cd ..
        git clone --recurse-submodules https://github.com/aris-pub/rsm.git
        echo "Cloned RSM repository to ../rsm"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache node_modules
      uses: actions/cache@v5
      id: cache-node-modules
      with:
        path: frontend/node_modules
        key: node-modules-frontend-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install frontend dependencies
      working-directory: frontend
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-frontend-${{ runner.os }}-${{ github.event_name == 'push' && 'all' || 'chromium' }}

    - name: Install Playwright browsers
      working-directory: frontend
      run: |
        npx playwright install chromium --with-deps
        if [ "${{ github.event_name }}" = "push" ]; then
          npx playwright install firefox --with-deps
        fi

    - name: Create .env file
      run: cp .env.example .env

    - name: Create backend .env file
      run: cp backend/.env.example backend/.env

    - name: Build and start Docker Compose services
      run: |
        docker compose --env-file .env build
        docker compose --env-file .env up -d

        echo "⏳ Waiting for services..."
        for i in $(seq 1 180); do
          if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
            echo "✅ Services ready after ${i}s"
            break
          fi
          if [ "$i" = "180" ]; then
            echo "❌ Services failed to start"
            docker compose --env-file .env logs --tail=30
            exit 1
          fi
          sleep 1
        done

    - name: Setup database and test user in Docker
      run: |
        docker compose --env-file .env exec -T backend uv run alembic upgrade head

    - name: Run frontend E2E tests
      working-directory: frontend
      run: |
        export $(cat ../.env | grep -v '^#' | grep -v '^$' | xargs)

        if [ "${{ github.event_name }}" = "push" ]; then
          echo "🧪 Running shard ${{ matrix.shard }}/4 on chromium + firefox..."
          npx playwright test \
            --grep "@auth|@auth-flows|@core" \
            --project=chromium --project=firefox \
            --shard=${{ matrix.shard }}/4 \
            --reporter=github
        else
          echo "🧪 Running shard ${{ matrix.shard }}/4 on chromium..."
          npx playwright test \
            --grep "@auth|@auth-flows|@core" \
            --project=chromium \
            --shard=${{ matrix.shard }}/4 \
            --reporter=github
        fi

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-frontend-shard${{ matrix.shard }}
        path: frontend/test-results/
        retention-days: 7

    - name: Show Docker logs on failure
      if: failure()
      run: |
        echo "📋 Backend logs:"
        docker compose --env-file .env logs backend
        echo "📋 Frontend logs:"
        docker compose --env-file .env logs frontend
        echo "📋 Collab logs:"
        docker compose --env-file .env logs collab

    - name: Cleanup Docker services
      if: always()
      run: |
        echo "🧹 Stopping containers for $COMPOSE_PROJECT_NAME..."
        docker compose down --remove-orphans
        echo "✅ Cleanup complete"

  e2e-collab:
    runs-on: ubuntu-latest
    env:
      ENV: CI
      VITE_LOG_LEVEL: WARN
      COMPOSE_FILE: docker/docker-compose.dev.yml
      COMPOSE_PROJECT_NAME: studio-e2e-collab

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Clone RSM repository
      run: |
        cd ..
        git clone --recurse-submodules https://github.com/aris-pub/rsm.git
        echo "Cloned RSM repository to ../rsm"

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Cache node_modules
      uses: actions/cache@v5
      id: cache-node-modules
      with:
        path: frontend/node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

    - name: Install frontend dependencies
      working-directory: frontend
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-collab-${{ runner.os }}-${{ github.event_name == 'push' && 'all' || 'chromium' }}

    - name: Install Playwright browsers
      working-directory: frontend
      run: |
        npx playwright install chromium --with-deps
        if [ "${{ github.event_name }}" = "push" ]; then
          npx playwright install firefox --with-deps
        fi

    - name: Create .env file
      run: cp .env.example .env

    - name: Create backend .env file
      run: cp backend/.env.example backend/.env

    - name: Build and start Docker Compose services
      run: |
        docker compose --env-file .env build
        docker compose --env-file .env up -d

        echo "⏳ Waiting for services..."
        for i in $(seq 1 180); do
          if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
            echo "✅ Services ready after ${i}s"
            break
          fi
          if [ "$i" = "180" ]; then
            echo "❌ Services failed to start"
            docker compose --env-file .env logs --tail=30
            exit 1
          fi
          sleep 1
        done

    - name: Setup database and test user in Docker
      run: |
        docker compose --env-file .env exec -T backend uv run alembic upgrade head

    - name: Run Y.js collaboration E2E tests
      working-directory: frontend
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "🧪 Running @collab E2E tests on chromium + firefox..."
          npx playwright test --grep "@collab" --project=chromium --reporter=github --workers=1
          npx playwright test --grep "@collab" --project=firefox --reporter=github --workers=1
        else
          echo "🧪 Running @collab E2E tests on chromium..."
          npx playwright test --grep "@collab" --project=chromium --reporter=github --workers=1
        fi

    - name: Upload test results on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-results-collab
        path: frontend/test-results/
        retention-days: 7

    - name: Show Docker logs on failure
      if: failure()
      run: |
        echo "📋 Backend logs:"
        docker compose --env-file .env logs backend
        echo "📋 Frontend logs:"
        docker compose --env-file .env logs frontend
        echo "📋 Multiplayer logs:"
        docker compose --env-file .env logs collab

    - name: Cleanup Docker services
      if: always()
      run: |
        echo "🧹 Stopping containers for $COMPOSE_PROJECT_NAME..."
        docker compose down --remove-orphans
        echo "✅ Cleanup complete"
