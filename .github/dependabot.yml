version: 2
updates:
  # Enable version updates for Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "backend"
      include: "scope"

  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    # This is a pnpm workspace: the single source of truth is the root
    # pnpm-lock.yaml (+ pnpm-workspace.yaml covering frontend, multi-player,
    # site). Dependabot must anchor at "/" so it resolves in pnpm-workspace mode
    # and regenerates the ROOT lock. Pointing it at "/frontend" put it in
    # per-directory npm mode (keyed off a leftover frontend/package-lock.json):
    # it bumped frontend/package.json but never the root lock, so CI's
    # `pnpm install --frozen-lockfile` failed with ERR_PNPM_OUTDATED_LOCKFILE
    # before a single test ran (see PRs #413, #419, #423-#431).
    # Group only minor and patch bumps; majors arrive as individual, reviewable
    # PRs (y-websocket 2.x -> 3.x in particular needs deliberate review). This
    # entry covers multi-player as a workspace member (its CI unit tests), but
    # NOT the multi-player/package-lock.json the backend image installs from via
    # `npm ci` — that lockfile is maintained by the /multi-player entry below, so
    # a multi-player dep bump may produce two PRs (pnpm workspace lock + npm image
    # lock); merge whichever fits and close the other.
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for the multi-player node service. The backend image
  # bundles it and installs its deps standalone via `npm ci` from
  # multi-player/package-lock.json. The pnpm-root entry above never touches that
  # npm lockfile, so without this entry ws / jsonwebtoken / y-websocket would stop
  # getting security updates in the shipped image. (multi-player/package-lock.json
  # is a real, consumed lockfile — unlike the stray frontend one removed in #432.)
  - package-ecosystem: "npm"
    directory: "/multi-player"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "multi-player"
    commit-message:
      prefix: "multiplayer"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
