version: 2
updates:
  # Enable version updates for Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "backend"
      include: "scope"

  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    # This is a pnpm workspace: the single source of truth is the root
    # pnpm-lock.yaml (+ pnpm-workspace.yaml covering frontend, multi-player,
    # site). Dependabot must anchor at "/" so it resolves in pnpm-workspace mode
    # and regenerates the ROOT lock. Pointing it at "/frontend" put it in
    # per-directory npm mode (keyed off a leftover frontend/package-lock.json):
    # it bumped frontend/package.json but never the root lock, so CI's
    # `pnpm install --frozen-lockfile` failed with ERR_PNPM_OUTDATED_LOCKFILE
    # before a single test ran (see PRs #413, #419, #423-#431).
    # Group only minor and patch bumps; majors arrive as individual, reviewable
    # PRs. y-websocket 2.x -> 3.x (in multi-player) must not land before the
    # Y.js beta-blocker P0s (std-7jxsk5, std-jmnni0). multi-player is also
    # installed via `npm ci` from multi-player/package-lock.json in the backend
    # image; until std-94x9 unifies it on pnpm, hand-regenerate that lock on any
    # multi-player bump.
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
