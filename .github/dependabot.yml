version: 2
updates:
  # Enable version updates for Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "backend"
      include: "scope"

  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "frontend"
      include: "scope"
    # Group only minor and patch bumps. Grouping majors with everything else
    # produced a weekly ~45-package PR that never merged: dependabot does not
    # reliably regenerate pnpm-lock.yaml for grouped workspace updates, so CI's
    # `pnpm install --frozen-lockfile` failed with ERR_PNPM_OUTDATED_LOCKFILE
    # before a single test ran (see PRs #413 and #419). Majors now arrive as
    # individual PRs, which keeps each one isolable and reviewable. In
    # particular y-websocket 2.x -> 3.x must not land before the Y.js
    # beta-blocker P0s (std-7jxsk5, std-jmnni0).
    groups:
      frontend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
