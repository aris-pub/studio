version: 2
updates:
  # Enable version updates for Python (backend)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "backend"
      include: "scope"

  # Enable version updates for npm (frontend)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
      include: "scope"
    # This is a pnpm workspace: the single source of truth is the root
    # pnpm-lock.yaml (+ pnpm-workspace.yaml covering frontend, multi-player,
    # site). Dependabot must anchor at "/" so it resolves in pnpm-workspace mode
    # and regenerates the ROOT lock. Pointing it at "/frontend" put it in
    # per-directory npm mode (keyed off a leftover frontend/package-lock.json):
    # it bumped frontend/package.json but never the root lock, so CI's
    # `pnpm install --frozen-lockfile` failed with ERR_PNPM_OUTDATED_LOCKFILE
    # before a single test ran (see PRs #413, #419, #423-#431).
    # Group only minor and patch bumps; majors arrive as individual, reviewable
    # PRs (y-websocket 2.x -> 3.x in particular needs deliberate review). This
    # entry covers multi-player as a pnpm workspace member: a multi-player dep
    # bump lands here (updates multi-player/package.json + the root pnpm-lock.yaml).
    #
    # NOTE: multi-player is ALSO installed standalone in the backend image via
    # `npm ci` from multi-player/package-lock.json. Dependabot cannot maintain that
    # npm lockfile with a separate /multi-player entry: bumping multi-player's
    # package.json there desyncs the root pnpm-lock.yaml and fails CI's frozen
    # install (ERR_PNPM_OUTDATED_LOCKFILE — tried in #447, reverted). So when a
    # multi-player dep bump lands via this entry, hand-regenerate
    # multi-player/package-lock.json (cd multi-player && npm install). The real fix
    # is to make multi-player single-toolchain (std-94x9 — reopened).
    groups:
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "leotrs"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
