# Frontend app (Vue SPA)
# Deploy to: app.rsm.studio
# Configure custom domain in Netlify dashboard: Site settings > Domain management

[build]
  publish = "dist"
  command = "cd .. && pnpm install --frozen-lockfile && pnpm --filter frontend run build"

[build.environment]
  PNPM_VERSION = "9"

[dev]
  command = "pnpm run dev"
  port = "${FRONTEND_PORT}"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
