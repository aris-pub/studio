# Frontend app (Vue SPA)
# Deploy to: app.rsm.studio
# Configure custom domain in Netlify dashboard: Site settings > Domain management

[build]
  publish = "dist"
  command = "cd .. && pnpm install --frozen-lockfile && pnpm --filter ./frontend run build && test -s frontend/dist/index.html"

[build.environment]
  PNPM_VERSION = "9"

# Netlify auto-builds a `deploy-preview-N--` URL for every PR. That build does
# NOT receive the per-PR VITE_API_BASE_URL, so it points at the PRODUCTION
# backend — a reviewer who logs in there operates on prod data. The repo's
# real per-PR previews are the `pr-N--` aliases published by
# .github/workflows/preview.yml.
#
# Publish an inert static notice for the deploy-preview context instead of the
# app. A *successful* build is required to replace the deploy-preview URL's
# content — a failing build leaves the previous (prod-pointing) app live. The
# notice has no JS and makes no backend calls, so it cannot reach production.
[context.deploy-preview]
  command = "true"
  publish = "deploy-preview-notice"

[dev]
  command = "pnpm run dev"
  port = "${FRONTEND_PORT}"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
