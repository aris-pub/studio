# Common configuration for all services
# Note: .env is loaded via docker compose --env-file flag (see start-dev.sh)
# This provides variable substitution (${VAR}) in this file.
# Each service explicitly lists its environment variables below.

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
      target: dev
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:${BACKEND_CONTAINER_PORT:?BACKEND_CONTAINER_PORT is required}"
    volumes:
      - ..:/workspace/studio
      - ../../rsm:/workspace/rsm
      - backend_venv:/workspace/studio/backend/.venv
    working_dir: /workspace/studio/backend
    environment:
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - TEST_DB_NAME=${TEST_DB_NAME}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/${DB_NAME}
      - TEST_DB_URL=postgresql://postgres:postgres@postgres:5432/${TEST_DB_NAME}
      - ALEMBIC_DB_URL_LOCAL=postgresql://postgres:postgres@postgres:5432/${DB_NAME}
      - DB_URL_LOCAL=postgresql+asyncpg://postgres:postgres@postgres:5432/${DB_NAME}
      - ENV=${ENV:-LOCAL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - COPILOT_PROVIDER=${COPILOT_PROVIDER}
      - MULTIPLAYER_HOST=collab
      - MULTIPLAYER_PORT=${MULTIPLAYER_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - SITE_PORT=${SITE_PORT}
      - STORYBOOK_PORT=${STORYBOOK_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend-test:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
      target: dev
    ports:
      - "${BACKEND_TEST_PORT:?BACKEND_TEST_PORT is required}:${BACKEND_CONTAINER_PORT:?BACKEND_CONTAINER_PORT is required}"
    volumes:
      - ..:/workspace/studio
      - ../../rsm:/workspace/rsm
      - backend_test_venv:/workspace/studio/backend/.venv
      - rsm_test_venv:/workspace/rsm/.venv
    working_dir: /workspace/studio/backend
    environment:
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - TEST_DB_NAME=${TEST_DB_NAME}
      - ENV=TEST
      - DB_URL_LOCAL=sqlite+aiosqlite:///./test_e2e.db
      - ALEMBIC_DB_URL_LOCAL=sqlite+pysqlite:///./test_e2e.db
      - TEST_USER_EMAIL=${TEST_USER_EMAIL}
      - TEST_USER_PASSWORD=${TEST_USER_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - COPILOT_PROVIDER=${COPILOT_PROVIDER}
      - MULTIPLAYER_HOST=collab
      - MULTIPLAYER_PORT=${MULTIPLAYER_PORT}
      - YJS_DEBOUNCE_MS=2000
      - FRONTEND_PORT=${FRONTEND_PORT}
      - FRONTEND_TEST_PORT=${FRONTEND_TEST_PORT}
      - SITE_PORT=${SITE_PORT}
      - STORYBOOK_PORT=${STORYBOOK_PORT}
    command: uvicorn main:app --host 0.0.0.0 --port ${BACKEND_CONTAINER_PORT} --reload
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
      target: dev
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is required}:${FRONTEND_CONTAINER_PORT:?FRONTEND_CONTAINER_PORT is required}"
    volumes:
      - ../frontend:/app
      - /app/node_modules  # Anonymous volume - no races, each container gets its own
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT}
      - VITE_MULTIPLAYER_URL=${VITE_MULTIPLAYER_URL}
    command: npm run dev -- --host 0.0.0.0

  frontend-test:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
      target: dev
    ports:
      - "${FRONTEND_TEST_PORT:?FRONTEND_TEST_PORT is required}:${FRONTEND_CONTAINER_PORT:?FRONTEND_CONTAINER_PORT is required}"
    volumes:
      - ../frontend:/app
      - /app/node_modules_test  # Separate node_modules for test frontend
    environment:
      - BACKEND_PORT=${BACKEND_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - SITE_PORT=${SITE_PORT}
      - STORYBOOK_PORT=${STORYBOOK_PORT}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - TEST_DB_NAME=${TEST_DB_NAME}
      - VITE_API_BASE_URL=http://localhost:${BACKEND_TEST_PORT}
      - VITE_MULTIPLAYER_URL=${VITE_MULTIPLAYER_URL}
      - VITE_ENV=test
      - NUXT_BACKEND_URL=http://localhost:${BACKEND_PORT}
    command: npm run dev -- --host 0.0.0.0

  collab:
    build:
      context: ..
      dockerfile: docker/multi-player/Dockerfile.dev
      target: dev
    ports:
      - "${MULTIPLAYER_PORT:?MULTIPLAYER_PORT is required}:${MULTIPLAYER_PORT}"
    volumes:
      - ../multi-player:/app
      - /app/node_modules  # Anonymous volume - no races, each container gets its own
    environment:
      - MULTIPLAYER_PORT=${MULTIPLAYER_PORT}
      - HOST=0.0.0.0
    restart: unless-stopped

  storybook:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
      target: dev
    ports:
      - "${STORYBOOK_PORT:?STORYBOOK_PORT is required}:${STORYBOOK_PORT}"
    volumes:
      - ../frontend:/app
      - /app/node_modules  # Anonymous volume - no races
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    command: npm run storybook -- --host 0.0.0.0 --no-open
    
  site:
    build:
      context: ..
      dockerfile: docker/site/Dockerfile.dev
      target: dev
    ports:
      - "${SITE_PORT:?SITE_PORT is required}:${SITE_CONTAINER_PORT:?SITE_CONTAINER_PORT is required}"
    volumes:
      - ../site:/app
      - ../brand:/brand
      - site_node_modules:/app/node_modules
    environment:
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT}
      - NUXT_BACKEND_URL=http://localhost:${BACKEND_PORT}
    command: npm run dev
    
  postgres:
    image: postgres:16
    ports:
      - "${DB_PORT:?DB_PORT is required}:${DB_CONTAINER_PORT:?DB_CONTAINER_PORT is required}"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/create_postgres_user.sql:/docker-entrypoint-initdb.d/01_create_postgres_user.sql
      - ./backend/init_test_db.sql:/docker-entrypoint-initdb.d/02_init_test_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend_venv:
  backend_test_venv:
  rsm_test_venv:
  site_node_modules:
  postgres_data: