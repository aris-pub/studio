# Common configuration for all services
# Note: .env is loaded via docker compose --env-file flag (see start-dev.sh)
# This provides variable substitution (${VAR}) in this file.
# Each service explicitly lists its environment variables below.

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile.dev
      target: dev
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:${BACKEND_CONTAINER_PORT:?BACKEND_CONTAINER_PORT is required}"
      - "${MULTIPLAYER_PORT:?MULTIPLAYER_PORT is required}:1234"
    volumes:
      - ..:/workspace/studio
      - ../../rsm:/workspace/rsm
      - backend_venv:/workspace/studio/backend/.venv
      - /workspace/studio/multi-player/node_modules  # Prevent host/container conflicts
      - /workspace/rsm/tree-sitter-rsm/node_modules  # Prevent host/container conflicts
    working_dir: /workspace/studio/backend
    environment:
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - TEST_DB_NAME=${TEST_DB_NAME}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/${DB_NAME}
      - TEST_DB_URL=postgresql://postgres:postgres@postgres:5432/${TEST_DB_NAME}
      - ALEMBIC_DB_URL_LOCAL=postgresql://postgres:postgres@postgres:5432/${DB_NAME}
      - DB_URL_LOCAL=postgresql+asyncpg://postgres:postgres@postgres:5432/${DB_NAME}
      - ENV=${ENV:-LOCAL}
      - MULTIPLAYER_HOST=localhost
      - MULTIPLAYER_PORT=${MULTIPLAYER_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - SITE_PORT=${SITE_PORT}
      - STORYBOOK_PORT=${STORYBOOK_PORT}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # backend-test is removed — tests run from OUTSIDE containers (see CLAUDE.md).
  # This mirrors production where containerized services receive external requests.

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
      target: dev
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is required}:${FRONTEND_CONTAINER_PORT:?FRONTEND_CONTAINER_PORT is required}"
    volumes:
      - ../frontend:/app
      - /app/node_modules  # Anonymous volume - no races, each container gets its own
    environment:
      - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT}
      - VITE_MULTIPLAYER_URL=${VITE_MULTIPLAYER_URL}
      - VITE_ENV=${ENV:-local}
    command: pnpm run dev -- --host 0.0.0.0

  # frontend-test is removed — tests run from OUTSIDE containers (see CLAUDE.md).

  # collab service is now integrated into backend via supervisord
  # This mirrors production deployment where all services run in a single container
  # collab:
  #   build:
  #     context: ..
  #     dockerfile: docker/multi-player/Dockerfile.dev
  #     target: dev
  #   ports:
  #     - "${MULTIPLAYER_PORT:?MULTIPLAYER_PORT is required}:${MULTIPLAYER_PORT}"
  #   volumes:
  #     - ../multi-player:/app
  #     - /app/node_modules  # Anonymous volume - no races, each container gets its own
  #   environment:
  #     - MULTIPLAYER_PORT=${MULTIPLAYER_PORT}
  #     - HOST=0.0.0.0
  #   restart: unless-stopped

  # Storybook is deprecated — we never used it in practice.
  # Code and infrastructure are kept in case we revisit, but the service is
  # excluded from `just dev` via the "storybook" profile. To start it manually:
  #   docker compose --profile storybook up storybook
  storybook:
    profiles: ["storybook"]
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile.dev
      target: dev
    ports:
      - "${STORYBOOK_PORT:?STORYBOOK_PORT is required}:${STORYBOOK_PORT}"
    volumes:
      - ../frontend:/app
      - /app/node_modules  # Anonymous volume - no races
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    command: pnpm run storybook -- --host 0.0.0.0 --no-open
    
  site:
    build:
      context: ..
      dockerfile: docker/site/Dockerfile.dev
      target: dev
    ports:
      - "${SITE_PORT:?SITE_PORT is required}:${SITE_CONTAINER_PORT:?SITE_CONTAINER_PORT is required}"
    volumes:
      - ../site:/app
      - ../brand:/brand
      - site_node_modules:/app/node_modules
    environment:
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT}
      - NUXT_BACKEND_URL=http://localhost:${BACKEND_PORT}
    command: pnpm run dev
    
  postgres:
    image: postgres:16
    ports:
      - "${DB_PORT:?DB_PORT is required}:${DB_CONTAINER_PORT:?DB_CONTAINER_PORT is required}"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/create_postgres_user.sql:/docker-entrypoint-initdb.d/01_create_postgres_user.sql
      - ./backend/init_test_db.sql:/docker-entrypoint-initdb.d/02_init_test_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  backend_venv:
  site_node_modules:
  postgres_data: