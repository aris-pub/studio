[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
command=/workspace/studio/backend/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /workspace/studio/backend --reload-dir /workspace/rsm
directory=/workspace/studio/backend
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100

[program:multiplayer]
command=/usr/bin/node server.js
directory=/workspace/studio/multi-player
environment=MULTIPLAYER_PORT="1234",HOST="0.0.0.0"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=200

[program:lsp]
command=/usr/bin/node dist/server.js --stdio
directory=/workspace/rsm/packages/rsm-lsp
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=300
