# CI override: use GHCR images as build cache for fast local builds.
# Usage: COMPOSE_FILE=docker/docker-compose.dev.yml:docker/docker-compose.ci.yml

services:
  backend:
    build:
      cache_from:
        - ghcr.io/aris-pub/studio/backend-dev:latest
  frontend:
    build:
      cache_from:
        - ghcr.io/aris-pub/studio/frontend-dev:latest
  site:
    build:
      cache_from:
        - ghcr.io/aris-pub/studio/site-dev:latest
