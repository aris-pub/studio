[project]
name = "aris-cli"
version = "0.1.0"
description = "Aris Studio CLI - Developer tool for local development only"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "rich>=13.0.0",
]

[project.scripts]
studio = "cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "responses>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
