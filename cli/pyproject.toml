[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[project]
name = "rsm-studio-cli"
version = "0.1.0"
description = "CLI for collaborating on RSM documents in Studio"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Leo Torres", email = "leo@leotrs.com" },
]
keywords = ["rsm", "studio", "collaboration", "research", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "pyjwt>=2.8.0",
    "rich>=13.0.0",
    "pycrdt>=0.12.50",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
]

[project.scripts]
studio = "cli:main"

[project.urls]
Homepage = "https://github.com/aris-pub/studio"
Repository = "https://github.com/aris-pub/studio"

[tool.uv]
dev-dependencies = [
    "python-dotenv>=1.0.0",
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "responses>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
