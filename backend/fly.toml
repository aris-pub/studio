# fly.toml app configuration file
# Generated for aris-backend on 2025-05-29T20:32:41+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aris-backend'
primary_region = 'fra'

# Graceful shutdown for Y.js doc flush (std-9u159j).
# 30s lets backend's shutdown_collaboration_manager (25s timeout) drain doc state
# to the DB before Fly sends SIGKILL. Default kill_timeout is 5s, which truncates
# in-flight 500ms-debounced edits and causes paragraph loss on Fly auto-stop events.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  # Public origin the browser reaches this backend at, used to build absolute
  # signed image-asset URLs in rendered manuscripts. Non-secret, so it lives here
  # rather than in Fly secrets.
  BACKEND_URL = "https://aris-backend.fly.dev"

  # Public origin of the frontend, used to build email links (verify-email,
  # collaborator invites). Without it, config.py defaults to http://localhost:5173
  # and prod emails point at localhost. Non-secret.
  FRONTEND_URL = "https://app.rsm.studio"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

  # rsm is fetched at this version: the Dockerfile git-clones aris-pub/rsm at
  # vX.Y.Z (for rsm-lsp + the grammar) and pins rsm-lang==X.Y.Z from PyPI. Bump
  # this one value to move every built environment to a new rsm release together.
  [build.args]
    RSM_VERSION = "1.5.1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# WebSocket service for Y.js multiplayer.
# `handlers = ["tls", "http"]` makes Fly's edge terminate TLS on port 1234
# using the app's wildcard *.fly.dev cert, then forward plain HTTP/WS to the
# container. Without this the frontend's `wss://...:1234` connection fails
# the TLS handshake and the editor never goes online.
[[services]]
  internal_port = 1234
  protocol = "tcp"
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 1234
    handlers = ["tls", "http"]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
