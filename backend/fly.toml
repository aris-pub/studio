# fly.toml app configuration file generated for aris-backend on 2025-05-29T20:32:41+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'aris-backend'
primary_region = 'fra'

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# WebSocket service for Y.js multiplayer (TCP passthrough)
[[services]]
  internal_port = 1234
  protocol = "tcp"
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 1234

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
